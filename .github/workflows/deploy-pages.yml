name: Build and deploy Medtriage demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export Medtriage for web
        run: pnpm --filter @workspace/medtriage exec expo export --platform web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}

      - name: Add GitHub Pages route fallback
        run: cp artifacts/medtriage/dist/index.html artifacts/medtriage/dist/404.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/medtriage/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
