kind = "mobile"
previewPath = "/"
title = "Medtriage"
description = "A Thai-first mobile care navigation prototype that guides people through an educational symptom check, nearby hospital options, appointment booking, and a digital check-in pass. Identity, AI triage, appointment, and hospital data are explicitly simulated for demonstration."
version = "1.0.0"
id = "artifacts/medtriage"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20790

[services.development]
run = "pnpm --filter @workspace/medtriage run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medtriage", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/medtriage", "run", "serve" ]

[services.env]
PORT = "20790"
BASE_PATH = "/"
